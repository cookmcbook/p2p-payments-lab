# Local learning overlay: shows what Spring, Hibernate and Spring MVC do inside each request.
#   docker compose -f compose.yaml -f infra/compose.debug.yaml up --build
#
# NEVER use this outside your own machine. org.hibernate.orm.jdbc.bind=TRACE prints every SQL parameter,
# including display names, and the extra actuator endpoints describe the application's internals.
# SPRING_APPLICATION_JSON is used instead of LOGGING_LEVEL_* variables because Spring lowercases logger
# names that come from environment variables, which would miss class names such as JpaTransactionManager.
services:
  payment-api:
    environment:
      SPRING_APPLICATION_JSON: >-
        {"logging":{"level":{
        "org.springframework.web.servlet.DispatcherServlet":"DEBUG",
        "org.springframework.web.servlet.mvc.method.annotation":"DEBUG",
        "org.springframework.orm.jpa.JpaTransactionManager":"DEBUG",
        "org.springframework.transaction.interceptor":"TRACE",
        "org.hibernate.engine.transaction.internal.TransactionImpl":"DEBUG",
        "org.hibernate.SQL":"DEBUG",
        "org.hibernate.orm.jdbc.bind":"TRACE"}}}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,beans,mappings,conditions,metrics

# Local learning overlay: turns on the lab-only funding endpoint used by the Chapter 3-4 experiments.
#   docker compose -f compose.yaml -f infra/compose.lab.yaml up --build
#   node infra/lab/race.mjs
# Add -f infra/compose.debug.yaml as well to watch the SQL and row locks (slower, and it logs names).
#
# The lab profile exposes POST /lab/ledger/funding with NO authentication (ADR 0005): anyone who can reach
# port 8080 can issue simulated money. Never deploy it. (Chapter 3's /lab/ledger/transfers was replaced by
# POST /api/v1/payments in Chapter 4; until Chapter 5 that API also trusts the X-Payer-Account-Id header.)
# It also exposes /actuator/metrics, which race.mjs samples to show HikariCP connections in use and waiting.
services:
  payment-api:
    environment:
      SPRING_PROFILES_ACTIVE: lab
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics

spring:
  application:
    name: payment-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/p2p_lab}
    username: ${DB_USERNAME:p2p_lab}
    password: ${DB_PASSWORD:local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
payments:
  idempotency:
    # Retention policy (ADR 0009): a key means the same payment for 24 hours, then may be reused.
    retention: PT24H
    purge-interval: PT1H
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

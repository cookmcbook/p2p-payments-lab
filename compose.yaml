services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: p2p_lab
      POSTGRES_USER: p2p_lab
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p2p_lab -d p2p_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
  payment-api:
    build: ./apps/payment-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/p2p_lab
      DB_USERNAME: p2p_lab
      DB_PASSWORD: local_dev_only
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
